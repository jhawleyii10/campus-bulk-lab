name: Test Email Notification

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          curl --fail-with-body -sS https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "$FROM_EMAIL" \
              --arg to "$NOTIFY_EMAIL" \
              '{from:$from,to:[$to],subject:"Campus Bulk Lab: Email Test",html:"<h2>Campus Bulk Lab</h2><p>Your automatic publication email notifications are working.</p>"}')"
